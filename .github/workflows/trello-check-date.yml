name: Trello checks

# Checks only. Deployment is in pages.yml, which calls this workflow and
# publishes one site containing every plugin.
on:
  pull_request:
    paths:
      - 'trello-check-date/**'
      - '.github/workflows/trello-check-date.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Check the preview
    runs-on: ubuntu-latest
    container: node:22.23.2-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    defaults:
      run:
        working-directory: trello-check-date
    steps:
      - uses: actions/checkout@v6
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Configure synthetic build
        run: npm run config
        env:
          TRELLO_APP_KEY: '00000000000000000000000000000000'
      - run: npm run build
